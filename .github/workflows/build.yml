name: build-and-run-targets

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build flintc from the assembly seed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File build-flintc.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Bootstrap fixed point
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File bootstrap\bootstrap.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Bootstrap gate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File bootstrap\gate.ps1
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Compile sample and run Windows PE target
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          pwsh -NoProfile -File flintc.ps1 -InputFile src\flintc\sample.fl -OutputFile build\flintc-pe.exe -AllTargets
          if ($LASTEXITCODE -ne 0) { throw "flintc exited $LASTEXITCODE" }
          $p = Start-Process -FilePath (Resolve-Path 'build\flintc-pe.exe') -Wait -PassThru
          if ($p.ExitCode -ne 20) { throw "PE target exited $($p.ExitCode), expected 20" }

      - name: Upload cross-target artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flint-targets
          path: |
            build/flintc-pe.exe
            build/flintc-pe.elf
            build/flintc-pe.macho
          if-no-files-found: error

  linux-run:
    needs: windows-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flint-targets

      - name: Run ELF64 target
        run: |
          chmod +x flintc-pe.elf
          file flintc-pe.elf
          set +e
          ./flintc-pe.elf
          code=$?
          set -e
          echo "ELF exit=$code"
          test "$code" -eq 20

  macos-run:
    needs: windows-build
    runs-on: macos-15-intel
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flint-targets

      - name: Run Mach-O target
        run: |
          uname -m
          chmod +x flintc-pe.macho
          xattr -d com.apple.quarantine flintc-pe.macho 2>/dev/null || true
          file flintc-pe.macho
          set +e
          ./flintc-pe.macho
          code=$?
          set -e
          echo "Mach-O exit=$code"
          test "$code" -eq 20
